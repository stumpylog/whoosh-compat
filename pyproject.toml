[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whoosh-compat"
version = "0.1.0.dev0"
description = "Whoosh query-language parser emitting programmatic tantivy queries"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
dependencies = ["python-dateutil>=2.8"]

[project.optional-dependencies]
tantivy = ["tantivy>=0.24"]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff",
  "mypy",
  "types-python-dateutil",
  "whoosh-compat[tantivy]",
  "Whoosh @ git+https://github.com/whoosh-community/whoosh@baa4d577fdb34bfcf30547c8c6bf853fffeb7fe0",
  "tzdata>=2026.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

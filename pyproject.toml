[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whoosh-compat"
version = "0.2.0"
description = "Whoosh query-language parser emitting programmatic tantivy queries"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
authors = [{ name = "Trenton H", email = "797416+stumpylog@users.noreply.github.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["python-dateutil>=2.8"]

[project.urls]
Repository = "https://github.com/stumpylog/whoosh-compat"

[project.optional-dependencies]
tantivy = ["tantivy>=0.26.0"]

[tool.hatch.build.targets.sdist]
# Everything here is AI-workflow material rather than library material, and
# publication is the one step that cannot be quietly amended: excluded content
# can be added to a later sdist, published content cannot be recalled.
#
#   .superpowers        task briefs, agent reports, raw review diffs. Also
#                       gitignored, but hatchling only reads the
#                       repository-root ignore file - the nested
#                       `.superpowers/sdd/.gitignore` that git honors is
#                       invisible to it, and no ignore file applies at all
#                       when building from an unpacked tree rather than a
#                       checkout. This exclude is what holds in every case.
#   docs/superpowers    plans, specs and raw review-findings reports. The
#                       findings files are largely about the *host* project
#                       (paperless-ngx), including write-ups of unfixed
#                       defects in another codebase; shipping those inside a
#                       public artifact should be a deliberate act, not a
#                       packaging default. The durable design rationale is in
#                       ARCHITECTURE.md and DIVERGENCES.md, which do ship.
#   .claude             agent skills for working on this repository.
#
# All three stay in git; this is about what gets uploaded, not what is kept.
exclude = [".superpowers", "docs/superpowers", ".claude"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis>=6",
  "ruff",
  "mypy",
  "types-python-dateutil",
  "whoosh-compat[tantivy]",
  "Whoosh @ git+https://github.com/whoosh-community/whoosh@baa4d577fdb34bfcf30547c8c6bf853fffeb7fe0",
  "tzdata>=2026.3",
  "pyrefly>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# Tests are also fully type-checked (parameters, fixtures, return types),
# run separately as `uv run mypy tests` since the real whoosh test-only
# dependency below has no stubs and some untyped-def leniency differs from
# src's.
module = "tests.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# The real whoosh package (test-only oracle dependency for tests/differential,
# see its pinned git ref above) ships no py.typed marker / type stubs.
module = "whoosh.*"
ignore_missing_imports = true

[tool.pyrefly]
# Matches `uv run mypy src`: only the library is type-checked, not tests.
project-includes = ["src"]
python-version = "3.11"

[tool.coverage.run]
source = ["whoosh_compat"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Pre-commit (and other tools) invoke ruff with explicit file paths rather
# than a directory; without this, `exclude`/`format.exclude` are only
# honored during directory traversal and would silently stop protecting
# the forked parser/ modules from ruff-format the moment they're passed by
# name instead of via `.`.
force-exclude = true

[tool.ruff.lint]
extend-select = ["I", "DTZ", "B", "RUF", "C4", "PT", "UP", "SIM"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
# Tests exercise the parser/AST's naive-local-time model on purpose
# (see src/whoosh_compat/parser/times.py's module docstring); constructing
# naive datetimes is the point, not an omission.
"tests/**" = ["DTZ001", "DTZ003", "DTZ005"]

[tool.ruff.format]
# The parser/ modules forked from whoosh (see ARCHITECTURE.md's "Module
# map with provenance") stay unformatted so they remain diffable against
# upstream whoosh; ruff check still lints them normally, this exclusion is
# format-only.
exclude = [
  "src/whoosh_compat/parser/default.py",
  "src/whoosh_compat/parser/plugins.py",
  "src/whoosh_compat/parser/syntax.py",
  "src/whoosh_compat/parser/taggers.py",
  "src/whoosh_compat/parser/common.py",
  "src/whoosh_compat/parser/dateparse.py",
  "src/whoosh_compat/parser/times.py",
  "src/whoosh_compat/parser/text.py",
]

[tool.codespell]
# Each of these is a deliberate false positive, not a typo to fix:
#   unparseable   - a legitimate, commonly used English spelling variant
#   nd, thur      - fragments of the date grammar's own regex/abbreviation
#                   tables (ordinal suffix "1st/2nd/3rd", "thursday|thur|thu")
#   febuary       - an intentionally accepted common misspelling in the date
#                   grammar's month-name matcher, not an error in this repo
#   priorized     - whoosh's own original spelling (see whoosh/qparser/
#                   default.py's _priorized), forked verbatim
#   ot            - a local variable (`ot = self.OpTagger`), not a word
#   runn          - the Porter-stemmed form of "running" used as test data
#   fo            - the stem in the example wildcard pattern `notes:fo*`
ignore-words-list = "unparseable,nd,thur,febuary,priorized,ot,runn,fo"

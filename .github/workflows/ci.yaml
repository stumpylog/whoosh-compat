name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # Caching is disabled here (and in the other jobs below) because
          # this workflow now runs on pushed release tags and ends in a
          # PyPI publish step: a cache populated by an untrusted run could
          # otherwise be reused when building the artifacts that get
          # published. zizmor flags this as cache-poisoning; see
          # https://docs.zizmor.sh/audits/#cache-poisoning.
          enable-cache: false

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test with coverage
        run: |
          uv run pytest tests --cov --cov-branch \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

      # Uploading to Codecov requires deciding on a repository token (and,
      # for a public repo, whether tokenless upload is acceptable). Left
      # commented out until that's settled; the raw coverage.xml is
      # available above as a workflow artifact in the meantime.
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      #   with:
      #     files: coverage.xml
      #     token: ${{ secrets.CODECOV_TOKEN }}

  tantivy-pin:
    name: tantivy ~=0.26.0 (paperless-ngx pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pin tantivy to paperless-ngx's version
        run: uv pip install "tantivy~=0.26.0"

      - name: Verify the pin took effect
        # Guards the step above staying meaningful: uv run re-syncs to
        # uv.lock by default, silently reverting the pip-installed pin, so
        # both run steps below need --no-sync. This check fails
        # the job outright if the imported tantivy does not satisfy the
        # pin, rather than letting the job silently test the lockfile's
        # version while claiming to test paperless-ngx's.
        run: |
          uv run --no-sync python -c "
          from importlib.metadata import version
          v = version('tantivy')
          assert v.startswith('0.26.'), f'pin did not take effect: tantivy {v}'
          print(f'testing against tantivy {v}')
          "

      - name: Test emitter against the pinned tantivy
        run: uv run --no-sync pytest tests/emitter

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, tantivy-pin]
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Verify built artifacts
        run: |
          set -euo pipefail

          sdist=$(ls dist/*.tar.gz)
          wheel=$(ls dist/*.whl)

          echo "Checking sdist contents: $sdist"
          sdist_contents=$(tar -tzf "$sdist")
          for f in LICENSE NOTICE py.typed; do
            if ! grep -q "$f" <<< "$sdist_contents"; then
              echo "::error::$f missing from sdist"
              exit 1
            fi
          done

          echo "Checking wheel imports cleanly: $wheel"
          uv run --with "$wheel" --no-project python -c "import whoosh_compat"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract this version's changelog section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${version}"
            exit 1
          fi

      - name: Create the release with the changelog section as its body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
